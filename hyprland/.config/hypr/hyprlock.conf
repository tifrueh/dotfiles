$font = Inter Display
$color_blue = rgb(97, 175, 239)
$color_black = rgb(40, 44, 52)
$color_white = rgb(220, 223, 228)
$color_cyan = rgb(86, 182, 192)
$color_red = rgb(224, 108, 117)
$color_yellow = rgb(229, 192, 123)

general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {

    pam {
        enabled = true
    }

    fingerprint {
        enabled = false
    }

}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    bezier = easeInOutSine, 0.37, 0, 0.63, 1
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 1, easeInOutSine
    animation = inputFieldColors, 1, 1, easeInOutSine
}

background {
    monitor =
    path = ~/.local/etc/background
    color = $color_black
}

input-field {
    monitor =
    size = 400, 50
    outline_thickness = 2
    dots_center = true
    outer_color = $color_blue
    inner_color = $color_black
    font_color = $color_white
    rounding = -1
    font_family = $font Bold
    fade_on_empty = false
    placeholder_text = Enter Password
    check_color = $color_cyan
    fail_color = $color_red
    capslock_color = $color_yellow

    position = 0, 50
    halign = center
    valign = bottom

    shadow_passes = 3
}

label {
    monitor =
    text = <b>$TIME</b>
    text_align = center
    color = $color_blue
    font_size = 80
    font_family = $font Black
    position = 0, -128
    halign = center
    valign = top

    shadow_passes = 3
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    text_align = center
    color = $color_white
    font_size = 16
    font_family = $font Bold
    position = 0, -255
    halign = center
    valign = top

    shadow_passes = 2
}
